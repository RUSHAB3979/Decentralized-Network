rule_files:
  - pilot-rules.yml

scrape_configs:
  - job_name: gpuorbit-orchestrator
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gpuorbit_metrics_token
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          instance: pilot
