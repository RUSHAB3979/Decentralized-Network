services:
  # --- DATABASE ---
  db:
    image: postgres:16
    container_name: marketplace_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ORCHESTRATOR ---
  orchestrator:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run dev:orchestrator"
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketplace}
      PROVIDER_TTL_MS: ${PROVIDER_TTL_MS:-120000}
    depends_on:
      db:
        condition: service_healthy

  # --- PROVIDER AGENT ---
  provider-agent:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run dev:agent"
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8080
      PROVIDER_ID: ${PROVIDER_ID:-provider-docker-1}
      REGION: ${REGION:-us-east-1}
      HEARTBEAT_SEC: ${HEARTBEAT_SEC:-15}
    depends_on:
      - orchestrator

volumes:
  pgdata:
