name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default token scopes for every job that does not declare its own block.
# pull-requests:read is required by dorny/paths-filter on pull_request events,
# where it resolves changed files through the API instead of a local git diff.
permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

# Cancel in-progress runs when a newer commit lands on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. DETECT CHANGES — path filtering so we only build what changed
  # ---------------------------------------------------------------
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      context: ${{ steps.filter.outputs.context }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            orchestrator:
              - 'services/orchestrator/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            agent:
              - 'services/provider-agent/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            web:
              - 'web-client/**'
              - '.github/workflows/**'
            python:
              - 'blender_pvp/**'
              - 'orchestrator/**'
            docker:
              - 'docker-compose.yml'
              - '.github/workflows/**'
            context:
              - 'services/context-server/**'
              - 'docs/**'
              - '.omp/mcp.json'
              - '.claude/mcp.json'
              - '.mcp.json'
              - '.cursor/mcp.json'
              - '.gemini/settings.json'

  # ---------------------------------------------------------------
  # 2. CONTRACTS — shared Zod schemas (everything depends on this)
  # ---------------------------------------------------------------
  contracts:
    name: Contracts — typecheck + build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install workspace deps (from root)
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: packages/contracts
        run: npm run typecheck
      - name: Build
        working-directory: packages/contracts
        run: npm run build

  # ---------------------------------------------------------------
  # 3. ORCHESTRATOR — control plane API
  # ---------------------------------------------------------------
  orchestrator:
    name: Orchestrator — typecheck + build
    runs-on: ubuntu-latest
    needs: [changes, contracts]
    if: needs.changes.outputs.orchestrator == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Build contracts dependency
        run: npm run build -w @market/contracts
      - name: Typecheck orchestrator
        working-directory: services/orchestrator
        run: npm run typecheck
      - name: Build orchestrator
        working-directory: services/orchestrator
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-dist
          path: services/orchestrator/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 4. PROVIDER AGENT — trusted daemon binary
  # ---------------------------------------------------------------
  provider-agent:
    name: Provider Agent — typecheck + build
    runs-on: ubuntu-latest
    needs: [changes, contracts]
    if: needs.changes.outputs.agent == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Build contracts dependency
        run: npm run build -w @market/contracts
      - name: Typecheck agent
        working-directory: services/provider-agent
        run: npm run typecheck
      - name: Build agent
        working-directory: services/provider-agent
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider-agent-dist
          path: services/provider-agent/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 5. WEB CLIENT — JavaScript + React + Vite + Tailwind
  # ---------------------------------------------------------------
  web:
    name: Web Client — build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # 6. PYTHON — Blender P2P worker scripts
  # ---------------------------------------------------------------
  python:
    name: Python — lint + syntax check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install lint deps
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check blender_pvp/ orchestrator/ --select=E9,F63,F7,F82 --target-version=py312
      - name: Compile check
        run: python -m py_compile blender_pvp/bmc.py

  # ---------------------------------------------------------------
  # 6.5 CONTEXT SERVER — startup knowledge base + MCP bridge
  # ---------------------------------------------------------------
  context-server:
    name: Context Server — typecheck + build
    runs-on: ubuntu-latest
    needs: [changes, contracts]
    if: needs.changes.outputs.context == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Build contracts dependency
        run: npm run build -w @market/contracts
      - name: Typecheck
        working-directory: services/context-server
        run: npm run typecheck
      - name: Build
        working-directory: services/context-server
        run: npm run build

  # ---------------------------------------------------------------
  # 7. DOCKER — validate compose file + build images
  # ---------------------------------------------------------------
  docker:
    name: Docker — validate compose + build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    env:
      # CI placeholders — required because compose uses ${VAR:?required}
      # interpolation. Real values live in GitHub Secrets / local .env.
      POSTGRES_USER: ci-marketplace
      POSTGRES_PASSWORD: ci-placeholder-not-a-secret
      POSTGRES_DB: ci-marketplace
      PROVIDER_ID: ci-provider
      ORCHESTRATOR_URL: http://orchestrator:8080
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose (full render + schema check)
        run: docker compose config --quiet
      - name: Build compose services
        run: |
          if grep -qE '^\s+build:' docker-compose.yml; then
            docker compose build --no-cache 2>&1 | tail -30
          else
            echo "Services reference pre-built images only (image: node:20) — nothing to build."
          fi

  # ---------------------------------------------------------------
  # 8. SECURITY — secrets + dependency + container scanning
  # ---------------------------------------------------------------
  security:
    name: Security — secrets + vuln scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read          # REQUIRED: declaring any permissions block sets all others to 'none';
                              # without this, checkout gets a tokenless fetch -> "repository not found"
      security-events: write  # For SARIF upload
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history needed for secrets scan

      - name: Gitleaks — scan for secrets in git history
        # Official GitHub Container Registry image. Report-only until the
        # .env / hardcoded password is purged from history and rotated.
        continue-on-error: true
        run: docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:latest git /repo --verbose --report-format json --report-path /repo/gitleaks-report.json || true

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (entire workspace)
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --workspaces --include-workspace-root || true
          echo "npm audit reported (non-blocking during early phase)"

      - name: npm audit — web-client
        run: cd web-client && npm ci && (npm audit --audit-level=high || true)

      - name: Trivy — scan for vulnerabilities
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true  # No findings = empty SARIF = upload may noop without hard-failing
        with:
          sarif_file: 'trivy-results.sarif'

  # ---------------------------------------------------------------
  # 9. SBOM — software bill of materials (supply-chain compliance)
  # ---------------------------------------------------------------
  sbom:
    name: SBOM — generate software bill of materials
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.agent == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install deps
        run: npm ci --ignore-scripts
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ---------------------------------------------------------------
  # 10. GATE — all checks must pass before merge
  # ---------------------------------------------------------------
  all-checks:
    name: 🟢 All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, contracts, orchestrator, provider-agent, web, python, docker, security, sbom, context-server]
    steps:
      - name: Report results
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "contracts=${{ needs.contracts.result }}"
          echo "orchestrator=${{ needs.orchestrator.result }}"
          echo "provider-agent=${{ needs.provider-agent.result }}"
          echo "web=${{ needs.web.result }}"
          echo "python=${{ needs.python.result }}"
          echo "docker=${{ needs.docker.result }}"
          echo "security=${{ needs.security.result }}"
          echo "sbom=${{ needs.sbom.result }}"
          echo "context-server=${{ needs['context-server'].result }}"

      - name: Fail if any required job failed or was cancelled
        run: |
          JOBS="changes contracts orchestrator provider-agent web python docker security sbom context-server"
          FAIL=0
          declare -A RESULTS=(
            [changes]="${{ needs.changes.result }}"
            [contracts]="${{ needs.contracts.result }}"
            [orchestrator]="${{ needs.orchestrator.result }}"
            [provider-agent]="${{ needs.provider-agent.result }}"
            [web]="${{ needs.web.result }}"
            [python]="${{ needs.python.result }}"
            [docker]="${{ needs.docker.result }}"
            [security]="${{ needs.security.result }}"
            [sbom]="${{ needs.sbom.result }}"
            [context-server]="${{ needs['context-server'].result }}"
          )
          for JOB in $JOBS; do
            R="${RESULTS[$JOB]}"
            if [ "$R" = "failure" ] || [ "$R" = "cancelled" ]; then
              echo "❌ $JOB: $R"
              FAIL=1
            elif [ "$R" = "skipped" ]; then
              echo "⏭️  $JOB: skipped (not triggered by path filter)"
            else
              echo "✅ $JOB: $R"
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "✅ All checks passed"
