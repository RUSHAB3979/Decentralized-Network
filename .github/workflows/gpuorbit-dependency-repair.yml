name: Temporary GPUOrbit dependency repair
on:
  push:
    branches: [gpuorbit-rebrand]
    paths:
      - '.github/workflows/gpuorbit-dependency-repair.yml'
permissions:
  contents: read
jobs:
  repair-audited-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out rebrand branch
        uses: actions/checkout@v4
        with:
          ref: gpuorbit-rebrand
          persist-credentials: true
      - name: Install Node 20 (CI baseline)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair vulnerable dependency resolutions and verify security
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts --omit=dev
          npm ci --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high --workspaces --include-workspace-root
      - name: Validate affected context server
        run: |
          npm run typecheck -w @market/context-server
          npm run build -w @market/context-server
      - name: Commit safe lockfile repairs and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/gpuorbit-dependency-repair.yml
          git commit -m "fix(deps): refresh audited workspace lockfile"
          git push origin HEAD:gpuorbit-rebrand
