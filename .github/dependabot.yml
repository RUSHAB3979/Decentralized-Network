version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /web-client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-production:
        dependency-type: production
      web-development:
        dependency-type: development

  # orchestrator/requirements.txt currently declares names with no version
  # specifiers, so every CI run resolves whatever is newest on PyPI. Dependabot
  # will open a PR pinning each one; keep those pins once they land.
  - package-ecosystem: pip
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # agent/requirements.txt is pinned exactly (httpx==, python-dotenv==), which
  # is deliberate — the agent installs on a provider's own machine. Pinned means
  # nothing moves on its own, including security fixes, so it needs its own
  # watcher. Without this entry the one component that runs on hardware we do
  # not control is the one component nothing updates.
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # No docker ecosystem entry. The repo contains no Dockerfile — docker-compose.yml
  # only pulls published images, which Dependabot's docker ecosystem does not read.
  # An entry pointing at / failed every scheduled run with
  # `dependency_file_not_found: No Dockerfiles nor Kubernetes YAML found in /`,
  # which is a permanently red job in the Actions tab reporting nothing.
  # Add it back the day a Dockerfile lands, pointed at that directory.
