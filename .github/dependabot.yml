version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /web-client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-production:
        dependency-type: production
      web-development:
        dependency-type: development

  # orchestrator/requirements.txt currently declares names with no version
  # specifiers, so every CI run resolves whatever is newest on PyPI. Dependabot
  # will open a PR pinning each one; keep those pins once they land.
  - package-ecosystem: pip
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
