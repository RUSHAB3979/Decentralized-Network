[pytest]
# Without testpaths, a bare `pytest -q` from the repository root walks into
# orchestrator\env and agent\env and tries to collect the test suites of every
# installed dependency. Those venvs are untracked, so this only bites people
# working locally -- CI installs into the runner and never sees them, which
# makes it exactly the kind of difference that wastes an afternoon.
# security/tests is listed explicitly, and its absence was a real gap rather
# than an oversight to shrug at: the CI path filter DOES trigger the Python job
# on security/**, so ruff linted the module and py_compile compiled it, and the
# suite still never ran. Green CI, zero security tests executed. A boundary
# whose tests do not run is a boundary nobody is checking. See CI-03 in
# docs/security/ci-security-audit.md.
testpaths = orchestrator/tests agent/tests security/tests

# Belt and braces: even if a suite is invoked by path, never descend into a
# virtualenv, a build directory, or the frozen TypeScript reference stack.
norecursedirs = *env .git node_modules dist build packaging/build packaging/dist services packages

# Quiet, deterministic output. -q is what CI runs.
addopts = -q
